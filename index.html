=<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Layout Studio</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #ffffff;          
            --secondary: #111111;        
            --accent: #ffffff;           
            --border: #ffffff;           
            --bg: #000000;               
            --card: #0d0d0d;             
            --text: #ffffff;             
            --text-muted: #b3b3b3;       
            --shadow: rgba(255, 255, 255, 0.08);
        }

        body {
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            min-height: 100vh;
            color: var(--text);
            padding: 0;
            margin: 0;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            text-align: center;
            padding: 3rem 2rem 2rem;
            background: var(--card);
            border-bottom: 1px solid var(--border);
            position: relative;
        }

        .header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 3px;
            background: var(--accent);
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 300;
            margin-bottom: 0.5rem;
            color: var(--primary);
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
        }

        .header p {
            font-size: 0.95rem;
            color: var(--text-muted);
            font-weight: 300;
            letter-spacing: 0.3px;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 380px 1fr;
            height: calc(100vh - 180px);
            background: var(--card);
        }

        @media (max-width: 1024px) {
            .main-grid {
                grid-template-columns: 1fr;
                height: auto;
            }
        }

        .sidebar {
            background: var(--card);
            border-right: 1px solid var(--border);
            overflow-y: auto;
            padding: 1.5rem;
        }

        .panel {
            background: var(--card);
            padding: 1.5rem;
            overflow-y: auto;
        }

        .panel h2 {
            font-size: 1.1rem;
            font-weight: 500;
            margin-bottom: 1.5rem;
            color: var(--primary);
            letter-spacing: -0.3px;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid var(--border);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            font-size: 0.9rem;
            color: var(--text);
        }

        .form-group input[type="file"] {
            display: none;
        }

        .upload-area {
            border: 2px dashed var(--border);
            border-radius: 8px;
            padding: 2rem 1rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.02);
        }

        .upload-area:hover {
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.04);
        }

        .upload-area.drag-over {
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.06);
        }

        select, input[type="number"], input[type="text"] {
            width: 100%;
            padding: 0.7rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.95rem;
            font-family: 'Outfit', sans-serif;
            transition: all 0.2s;
            background: black;
            color: var(--text);
        }

        select:focus, input[type="number"]:focus, input[type="text"]:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.1);
        }

        .settings-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.7rem;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 6px;
            border: 1px solid var(--border);
        }

        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .checkbox-group label {
            margin: 0;
            cursor: pointer;
            font-weight: 400;
        }

        .btn {
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Outfit', sans-serif;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            justify-content: center;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-primary {
            background: var(--primary);
            color: black;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(255, 255, 255, 0.2);
        }

        .btn-secondary {
            background: var(--secondary);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover:not(:disabled) {
            background: #1a1a1a;
            border-color: var(--primary);
        }

        .btn-group {
            display: flex;
            gap: 0.75rem;
            margin-top: 1.5rem;
        }

        .info-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem;
            margin-top: 1.5rem;
        }

        .info-card h4 {
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: var(--primary);
        }

        .info-card p {
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.6;
        }

        .preview-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 500px;
            background: #000;
            border-radius: 8px;
            padding: 2rem;
            overflow: auto;
        }

        .canvas-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
        }

        .paper-canvas {
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            border-radius: 4px;
            max-width: 90%;
            max-height: calc(100vh - 300px);
            width: auto;
            height: auto;
        }

        .interactive-canvas {
            user-select: none;
        }

        .fit-fill-options {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }

        .fit-fill-btn {
            padding: 0.7rem;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Outfit, sans-serif';
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.2s;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        const PHOTO_SIZES = {
            '2x2': { label: '2×2 inch (51×51mm)', width: 51, height: 51 },
            'passport': { label: 'Passport (35×45mm)', width: 35, height: 45 },
            '1x1': { label: '1×1 inch (25×25mm)', width: 25, height: 25 },
            '4x6': { label: '4×6 inch (102×152mm)', width: 102, height: 152 },
            '5x7': { label: '5×7 inch (127×178mm)', width: 127, height: 178 },
            'custom': { label: 'Custom Size', width: 50, height: 50 }
        };

        const PAPER_SIZES = {
            'A4': { label: 'A4 (210×297mm)', width: 210, height: 297 },
            'short': { label: 'Short Bond (8.5×11")', width: 215.9, height: 279.4 },
            'long': { label: 'Long Bond (8.5×13")', width: 215.9, height: 330.2 },
            'letter': { label: 'Letter (8.5×11")', width: 215.9, height: 279.4 },
            'legal': { label: 'Legal (8.5×14")', width: 215.9, height: 355.6 }
        };

        function PhotoLayoutApp() {
            const [images, setImages] = useState({});
            const [currentImageId, setCurrentImageId] = useState(null);
            const [photos, setPhotos] = useState([]);
            const [photoSize, setPhotoSize] = useState('2x2');
            const [paperSize, setPaperSize] = useState('A4');
            const [customWidth, setCustomWidth] = useState(50);
            const [customHeight, setCustomHeight] = useState(50);
            const [showBorder, setShowBorder] = useState(true);
            const [borderWidth, setBorderWidth] = useState(2);
            const [borderColor, setBorderColor] = useState('#000000');
            const [selectedPhoto, setSelectedPhoto] = useState(null);
            const [selectedPhotos, setSelectedPhotos] = useState([]);
            const [dragging, setDragging] = useState(false);
            const [resizing, setResizing] = useState(false);
            const [dragStart, setDragStart] = useState({ x: 0, y: 0 });
            const [exportFormat, setExportFormat] = useState('png');
            const [isDragOver, setIsDragOver] = useState(false);
            const [panningImage, setPanningImage] = useState(false);
            const [panStart, setPanStart] = useState({ x: 0, y: 0 });
            const [guides, setGuides] = useState([]);
            const [clipboard, setClipboard] = useState(null);
            const [zoom, setZoom] = useState(1);

            const canvasRef = useRef(null);
            const fileInputRef = useRef(null);

            const DPI = 300;
            const MM_TO_PX = DPI / 25.4;

            useEffect(() => {
                drawCanvas();
            }, [photos, paperSize, selectedPhoto, selectedPhotos, guides]);

            useEffect(() => {
                const handleKeyDown = (e) => {
                    const hasSelection = selectedPhoto !== null || selectedPhotos.length > 0;
                    if (!hasSelection && !e.ctrlKey && !e.metaKey) return;
                    
                    // Ctrl+C - Copy
                    if ((e.ctrlKey || e.metaKey) && e.key === 'c') {
                        if (selectedPhotos.length > 0) {
                            e.preventDefault();
                            const photosToCopy = photos.filter(p => selectedPhotos.includes(p.id));
                            setClipboard(photosToCopy);
                        } else if (selectedPhoto !== null) {
                            e.preventDefault();
                            const photo = photos.find(p => p.id === selectedPhoto);
                            if (photo) {
                                setClipboard([photo]);
                            }
                        }
                    }
                    // Ctrl+V - Paste
                    else if ((e.ctrlKey || e.metaKey) && e.key === 'v') {
                        if (clipboard && clipboard.length > 0) {
                            e.preventDefault();
                            const newPhotos = clipboard.map((photo, index) => ({
                                ...photo,
                                id: Date.now() + index,
                                x: photo.x + 20,
                                y: photo.y + 20
                            }));
                            setPhotos(prev => [...prev, ...newPhotos]);
                            setSelectedPhotos(newPhotos.map(p => p.id));
                            setSelectedPhoto(null);
                        }
                    }
                    // Ctrl+A - Select All
                    else if ((e.ctrlKey || e.metaKey) && e.key === 'a') {
                        e.preventDefault();
                        setSelectedPhotos(photos.map(p => p.id));
                        setSelectedPhoto(null);
                    }
                    // Ctrl+D - Duplicate (alternative)
                    else if ((e.ctrlKey || e.metaKey) && e.key === 'd') {
                        if (hasSelection) {
                            e.preventDefault();
                            duplicateSelectedPhoto();
                        }
                    }
                    // Delete key
                    else if (e.key === 'Delete' || e.key === 'Backspace') {
                        if (hasSelection) {
                            e.preventDefault();
                            deleteSelectedPhoto();
                        }
                    }
                    // Arrow keys for moving
                    else if (e.key === 'ArrowLeft') {
                        if (hasSelection) {
                            e.preventDefault();
                            const moveAmount = e.shiftKey ? 1 : 10;
                            setPhotos(prev => prev.map(p =>
                                (p.id === selectedPhoto || selectedPhotos.includes(p.id)) 
                                    ? { ...p, x: p.x - moveAmount } 
                                    : p
                            ));
                        }
                    }
                    else if (e.key === 'ArrowRight') {
                        if (hasSelection) {
                            e.preventDefault();
                            const moveAmount = e.shiftKey ? 1 : 10;
                            setPhotos(prev => prev.map(p =>
                                (p.id === selectedPhoto || selectedPhotos.includes(p.id))
                                    ? { ...p, x: p.x + moveAmount }
                                    : p
                            ));
                        }
                    }
                    else if (e.key === 'ArrowUp') {
                        if (hasSelection) {
                            e.preventDefault();
                            const moveAmount = e.shiftKey ? 1 : 10;
                            setPhotos(prev => prev.map(p =>
                                (p.id === selectedPhoto || selectedPhotos.includes(p.id))
                                    ? { ...p, y: p.y - moveAmount }
                                    : p
                            ));
                        }
                    }
                    else if (e.key === 'ArrowDown') {
                        if (hasSelection) {
                            e.preventDefault();
                            const moveAmount = e.shiftKey ? 1 : 10;
                            setPhotos(prev => prev.map(p =>
                                (p.id === selectedPhoto || selectedPhotos.includes(p.id))
                                    ? { ...p, y: p.y + moveAmount }
                                    : p
                            ));
                        }
                    }
                    // D for duplicate
                    else if (e.key === 'd' || e.key === 'D') {
                        if (hasSelection && !e.ctrlKey && !e.metaKey) {
                            e.preventDefault();
                            duplicateSelectedPhoto();
                        }
                    }
                    // R for rotate right
                    else if (e.key === 'r' || e.key === 'R') {
                        if (hasSelection) {
                            e.preventDefault();
                            rotateRight();
                        }
                    }
                    // L for rotate left
                    else if (e.key === 'l' || e.key === 'L') {
                        if (hasSelection) {
                            e.preventDefault();
                            rotateLeft();
                        }
                    }
                };

                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [selectedPhoto, selectedPhotos, photos, clipboard]);

            const mmToPx = (mm) => mm * MM_TO_PX;

            const getPhotoSizePx = () => {
                const size = photoSize === 'custom'
                    ? { width: customWidth, height: customHeight }
                    : PHOTO_SIZES[photoSize];
                return { width: mmToPx(size.width), height: mmToPx(size.height) };
            };

            const getPaperSizePx = () => {
                const size = PAPER_SIZES[paperSize];
                return { width: mmToPx(size.width), height: mmToPx(size.height) };
            };

            const getSnapGuides = (currentPhoto, newX, newY) => {
                const snapDistance = 10;
                const detectedGuides = [];
                const paperPx = getPaperSizePx();

                // Canvas center lines
                const canvasCenterX = paperPx.width / 2;
                const canvasCenterY = paperPx.height / 2;

                // Current photo edges
                const currentLeft = newX;
                const currentRight = newX + currentPhoto.width;
                const currentTop = newY;
                const currentBottom = newY + currentPhoto.height;
                const currentCenterX = newX + currentPhoto.width / 2;
                const currentCenterY = newY + currentPhoto.height / 2;

                let snappedX = newX;
                let snappedY = newY;

                // Check canvas alignment
                if (Math.abs(currentCenterX - canvasCenterX) < snapDistance) {
                    snappedX = canvasCenterX - currentPhoto.width / 2;
                    detectedGuides.push({ type: 'vertical', pos: canvasCenterX });
                }
                if (Math.abs(currentCenterY - canvasCenterY) < snapDistance) {
                    snappedY = canvasCenterY - currentPhoto.height / 2;
                    detectedGuides.push({ type: 'horizontal', pos: canvasCenterY });
                }

                // Check alignment with other photos
                photos.forEach(photo => {
                    if (photo.id === currentPhoto.id) return;

                    const otherLeft = photo.x;
                    const otherRight = photo.x + photo.width;
                    const otherTop = photo.y;
                    const otherBottom = photo.y + photo.height;
                    const otherCenterX = photo.x + photo.width / 2;
                    const otherCenterY = photo.y + photo.height / 2;

                    // Vertical alignment
                    if (Math.abs(currentLeft - otherLeft) < snapDistance) {
                        snappedX = otherLeft;
                        detectedGuides.push({ type: 'vertical', pos: otherLeft });
                    } else if (Math.abs(currentRight - otherRight) < snapDistance) {
                        snappedX = otherRight - currentPhoto.width;
                        detectedGuides.push({ type: 'vertical', pos: otherRight });
                    } else if (Math.abs(currentCenterX - otherCenterX) < snapDistance) {
                        snappedX = otherCenterX - currentPhoto.width / 2;
                        detectedGuides.push({ type: 'vertical', pos: otherCenterX });
                    } else if (Math.abs(currentLeft - otherRight) < snapDistance) {
                        snappedX = otherRight;
                        detectedGuides.push({ type: 'vertical', pos: otherRight });
                    } else if (Math.abs(currentRight - otherLeft) < snapDistance) {
                        snappedX = otherLeft - currentPhoto.width;
                        detectedGuides.push({ type: 'vertical', pos: otherLeft });
                    }

                    // Horizontal alignment
                    if (Math.abs(currentTop - otherTop) < snapDistance) {
                        snappedY = otherTop;
                        detectedGuides.push({ type: 'horizontal', pos: otherTop });
                    } else if (Math.abs(currentBottom - otherBottom) < snapDistance) {
                        snappedY = otherBottom - currentPhoto.height;
                        detectedGuides.push({ type: 'horizontal', pos: otherBottom });
                    } else if (Math.abs(currentCenterY - otherCenterY) < snapDistance) {
                        snappedY = otherCenterY - currentPhoto.height / 2;
                        detectedGuides.push({ type: 'horizontal', pos: otherCenterY });
                    } else if (Math.abs(currentTop - otherBottom) < snapDistance) {
                        snappedY = otherBottom;
                        detectedGuides.push({ type: 'horizontal', pos: otherBottom });
                    } else if (Math.abs(currentBottom - otherTop) < snapDistance) {
                        snappedY = otherTop - currentPhoto.height;
                        detectedGuides.push({ type: 'horizontal', pos: otherTop });
                    }
                });

                return { x: snappedX, y: snappedY, guides: detectedGuides };
            };

            const handleFileChange = (e) => {
                const file = e.target.files[0];
                if (file && file.type.startsWith('image/')) {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        const img = new Image();
                        img.onload = () => {
                            const id = Date.now();
                            setImages(prev => ({
                                ...prev,
                                [id]: { id, name: file.name, data: event.target.result, img }
                            }));
                            setCurrentImageId(id);
                        };
                        img.src = event.target.result;
                    };
                    reader.readAsDataURL(file);
                }
            };

            const handleDrop = (e) => {
                e.preventDefault();
                setIsDragOver(false);
                const file = e.dataTransfer.files[0];
                if (file && file.type.startsWith('image/')) {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        const img = new Image();
                        img.onload = () => {
                            const id = Date.now();
                            setImages(prev => ({
                                ...prev,
                                [id]: { id, name: file.name, data: event.target.result, img }
                            }));
                            setCurrentImageId(id);
                        };
                        img.src = event.target.result;
                    };
                    reader.readAsDataURL(file);
                }
            };

            const handleDragOver = (e) => {
                e.preventDefault();
                setIsDragOver(true);
            };

            const handleDragLeave = () => {
                setIsDragOver(false);
            };

            const addPhoto = () => {
                if (!currentImageId) return;
                const paperPx = getPaperSizePx();
                const photoPx = getPhotoSizePx();
                const newPhoto = {
                    id: Date.now(),
                    imageId: currentImageId,
                    x: (paperPx.width - photoPx.width) / 2,
                    y: (paperPx.height - photoPx.height) / 2,
                    width: photoPx.width,
                    height: photoPx.height,
                    rotation: 0,
                    fitMode: 'fill', // 'fit', 'fill', or 'stretch'
                    offsetX: 0,
                    offsetY: 0,
                    scale: 1
                };
                setPhotos(prev => [...prev, newPhoto]);
            };

            const drawCanvas = () => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                const paperPx = getPaperSizePx();

                canvas.width = paperPx.width;
                canvas.height = paperPx.height;

                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                photos.forEach(photo => {
                    const image = images[photo.imageId];
                    if (!image) return;

                    ctx.save();
                    ctx.translate(photo.x + photo.width / 2, photo.y + photo.height / 2);
                    ctx.rotate((photo.rotation * Math.PI) / 180);

                    // Draw image based on fit mode
                    const img = image.img;
                    const frameWidth = photo.width;
                    const frameHeight = photo.height;

                    if (photo.fitMode === 'stretch') {
                        // Stretch mode: distort to fit frame exactly
                        ctx.drawImage(
                            img,
                            -frameWidth / 2,
                            -frameHeight / 2,
                            frameWidth,
                            frameHeight
                        );
                    } else {
                        // Fit or Fill mode
                        const imgAspect = img.width / img.height;
                        const frameAspect = frameWidth / frameHeight;

                        let drawWidth, drawHeight;

                        if (photo.fitMode === 'fit') {
                            // Fit: entire image visible, may have letterboxing
                            if (imgAspect > frameAspect) {
                                drawWidth = frameWidth;
                                drawHeight = frameWidth / imgAspect;
                            } else {
                                drawHeight = frameHeight;
                                drawWidth = frameHeight * imgAspect;
                            }
                        } else {
                            // Fill: fills frame completely, may crop
                            if (imgAspect > frameAspect) {
                                drawHeight = frameHeight;
                                drawWidth = frameHeight * imgAspect;
                            } else {
                                drawWidth = frameWidth;
                                drawHeight = frameWidth / imgAspect;
                            }
                        }

                        // Apply user panning offset
                        const offsetX = photo.offsetX || 0;
                        const offsetY = photo.offsetY || 0;

                        // Clip to frame
                        ctx.beginPath();
                        ctx.rect(-frameWidth / 2, -frameHeight / 2, frameWidth, frameHeight);
                        ctx.clip();

                        ctx.drawImage(
                            img,
                            -drawWidth / 2 + offsetX,
                            -drawHeight / 2 + offsetY,
                            drawWidth,
                            drawHeight
                        );
                    }

                    ctx.restore();

                    // Draw border
                    if (showBorder) {
                        ctx.save();
                        ctx.translate(photo.x + photo.width / 2, photo.y + photo.height / 2);
                        ctx.rotate((photo.rotation * Math.PI) / 180);
                        ctx.strokeStyle = borderColor;
                        ctx.lineWidth = borderWidth;
                        ctx.strokeRect(-photo.width / 2, -photo.height / 2, photo.width, photo.height);
                        ctx.restore();
                    }

                    // Draw selection indicator
                    if (selectedPhoto === photo.id || selectedPhotos.includes(photo.id)) {
                        ctx.save();
                        ctx.translate(photo.x + photo.width / 2, photo.y + photo.height / 2);
                        ctx.rotate((photo.rotation * Math.PI) / 180);
                        ctx.strokeStyle = '#0066ff';
                        ctx.lineWidth = 4;
                        ctx.setLineDash([10, 5]);
                        ctx.strokeRect(-photo.width / 2 - 5, -photo.height / 2 - 5, photo.width + 10, photo.height + 10);
                        
                        // Draw resize handle only for single selection
                        if (selectedPhoto === photo.id && selectedPhotos.length === 0) {
                            ctx.fillStyle = '#0066ff';
                            ctx.fillRect(photo.width / 2 - 5, photo.height / 2 - 5, 10, 10);
                        }
                        ctx.restore();
                    }
                });

                // Draw alignment guides
                if (guides.length > 0) {
                    ctx.save();
                    ctx.strokeStyle = '#00ff00';
                    ctx.lineWidth = 1;
                    ctx.setLineDash([5, 5]);

                    guides.forEach(guide => {
                        if (guide.type === 'vertical') {
                            ctx.beginPath();
                            ctx.moveTo(guide.pos, 0);
                            ctx.lineTo(guide.pos, canvas.height);
                            ctx.stroke();
                        } else {
                            ctx.beginPath();
                            ctx.moveTo(0, guide.pos);
                            ctx.lineTo(canvas.width, guide.pos);
                            ctx.stroke();
                        }
                    });

                    ctx.restore();
                }
            };

            const getClickedPhoto = (x, y) => {
                for (let i = photos.length - 1; i >= 0; i--) {
                    const photo = photos[i];
                    const dx = x - (photo.x + photo.width / 2);
                    const dy = y - (photo.y + photo.height / 2);
                    const angle = (-photo.rotation * Math.PI) / 180;
                    const rx = dx * Math.cos(angle) - dy * Math.sin(angle);
                    const ry = dx * Math.sin(angle) + dy * Math.cos(angle);

                    if (Math.abs(rx) <= photo.width / 2 && Math.abs(ry) <= photo.height / 2) {
                        return photo;
                    }
                }
                return null;
            };

            const isNearResizeHandle = (x, y, photo) => {
                const handleX = photo.x + photo.width;
                const handleY = photo.y + photo.height;
                const distance = Math.sqrt((x - handleX) ** 2 + (y - handleY) ** 2);
                return distance < 15;
            };

            const handleMouseDown = (e) => {
                const canvas = canvasRef.current;
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                const x = (e.clientX - rect.left) * scaleX;
                const y = (e.clientY - rect.top) * scaleY;

                const clickedPhoto = getClickedPhoto(x, y);

                if (clickedPhoto) {
                    // Shift+Click for group selection
                    if (e.shiftKey && !e.ctrlKey && !e.metaKey) {
                        if (selectedPhotos.includes(clickedPhoto.id)) {
                            setSelectedPhotos(prev => prev.filter(id => id !== clickedPhoto.id));
                        } else {
                            setSelectedPhotos(prev => [...prev, clickedPhoto.id]);
                        }
                        setSelectedPhoto(null);
                    } else {
                        // Clear group selection if clicking without shift
                        if (selectedPhotos.length > 0) {
                            setSelectedPhotos([]);
                        }
                        setSelectedPhoto(clickedPhoto.id);

                        if (isNearResizeHandle(x, y, clickedPhoto)) {
                            setResizing(true);
                            setDragStart({ x, y });
                        } else {
                            // Check if we're panning the image (hold Ctrl/Cmd key)
                            if (e.ctrlKey || e.metaKey) {
                                setPanningImage(true);
                                setPanStart({ x, y });
                            } else {
                                setDragging(true);
                                setDragStart({ x: x - clickedPhoto.x, y: y - clickedPhoto.y });
                            }
                        }
                    }
                } else {
                    setSelectedPhoto(null);
                    setSelectedPhotos([]);
                }
            };

            const handleMouseMove = (e) => {
                const canvas = canvasRef.current;
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                const x = (e.clientX - rect.left) * scaleX;
                const y = (e.clientY - rect.top) * scaleY;

                if (dragging && selectedPhoto !== null) {
                    const currentPhoto = photos.find(p => p.id === selectedPhoto);
                    if (currentPhoto) {
                        const newX = x - dragStart.x;
                        const newY = y - dragStart.y;
                        const snapped = getSnapGuides(currentPhoto, newX, newY);
                        
                        // Move selected photo and all grouped photos together
                        const deltaX = snapped.x - currentPhoto.x;
                        const deltaY = snapped.y - currentPhoto.y;
                        
                        setPhotos(prev => prev.map(p => {
                            if (p.id === selectedPhoto || selectedPhotos.includes(p.id)) {
                                return { ...p, x: p.x + deltaX, y: p.y + deltaY };
                            }
                            return p;
                        }));
                        setGuides(snapped.guides);
                    }
                } else if (resizing && selectedPhoto !== null) {
                    setPhotos(prev => prev.map(p => {
                        if (p.id === selectedPhoto) {
                            const deltaX = x - dragStart.x;
                            const deltaY = y - dragStart.y;
                            const newWidth = Math.max(50, p.width + deltaX);
                            const newHeight = Math.max(50, p.height + deltaY);
                            setDragStart({ x, y });
                            return { ...p, width: newWidth, height: newHeight };
                        }
                        return p;
                    }));
                } else if (panningImage && selectedPhoto !== null) {
                    setPhotos(prev => prev.map(p => {
                        if (p.id === selectedPhoto) {
                            const deltaX = x - panStart.x;
                            const deltaY = y - panStart.y;
                            return {
                                ...p,
                                offsetX: (p.offsetX || 0) + deltaX,
                                offsetY: (p.offsetY || 0) + deltaY
                            };
                        }
                        return p;
                    }));
                    setPanStart({ x, y });
                } else {
                    setGuides([]);
                }
            };

            const handleMouseUp = () => {
                setDragging(false);
                setResizing(false);
                setPanningImage(false);
                setGuides([]);
            };

            const rotateLeft = () => {
                if (selectedPhoto === null && selectedPhotos.length === 0) return;
                setPhotos(prev => prev.map(p =>
                    (p.id === selectedPhoto || selectedPhotos.includes(p.id)) 
                        ? { ...p, rotation: p.rotation - 90 } 
                        : p
                ));
            };

            const rotateRight = () => {
                if (selectedPhoto === null && selectedPhotos.length === 0) return;
                setPhotos(prev => prev.map(p =>
                    (p.id === selectedPhoto || selectedPhotos.includes(p.id))
                        ? { ...p, rotation: p.rotation + 90 }
                        : p
                ));
            };

            const duplicateSelectedPhoto = () => {
                if (selectedPhotos.length > 0) {
                    const photosToDuplicate = photos.filter(p => selectedPhotos.includes(p.id));
                    const newPhotos = photosToDuplicate.map((photo, index) => ({
                        ...photo,
                        id: Date.now() + index,
                        x: photo.x + 20,
                        y: photo.y + 20
                    }));
                    setPhotos(prev => [...prev, ...newPhotos]);
                    setSelectedPhotos(newPhotos.map(p => p.id));
                } else if (selectedPhoto !== null) {
                    const photo = photos.find(p => p.id === selectedPhoto);
                    if (photo) {
                        const newPhoto = { ...photo, id: Date.now(), x: photo.x + 20, y: photo.y + 20 };
                        setPhotos(prev => [...prev, newPhoto]);
                        setSelectedPhoto(newPhoto.id);
                    }
                }
            };

            const deleteSelectedPhoto = () => {
                if (selectedPhotos.length > 0) {
                    setPhotos(prev => prev.filter(p => !selectedPhotos.includes(p.id)));
                    setSelectedPhotos([]);
                } else if (selectedPhoto !== null) {
                    setPhotos(prev => prev.filter(p => p.id !== selectedPhoto));
                    setSelectedPhoto(null);
                }
            };

            const clearAll = () => {
                setPhotos([]);
                setSelectedPhoto(null);
                setSelectedPhotos([]);
            };

            const zoomIn = () => {
                setZoom(prev => Math.min(prev + 0.1, 3));
            };

            const zoomOut = () => {
                setZoom(prev => Math.max(prev - 0.1, 0.3));
            };

            const resetZoom = () => {
                setZoom(1);
            };

            const setFitMode = (mode) => {
                if (selectedPhoto === null && selectedPhotos.length === 0) return;
                setPhotos(prev => prev.map(p =>
                    (p.id === selectedPhoto || selectedPhotos.includes(p.id))
                        ? { ...p, fitMode: mode, offsetX: 0, offsetY: 0 }
                        : p
                ));
            };

            const downloadAsPDF = async () => {
                const canvas = canvasRef.current;
                const { jsPDF } = window.jspdf;
                const currentPaperSize = PAPER_SIZES[paperSize];
                const pdf = new jsPDF({
                    orientation: currentPaperSize.width > currentPaperSize.height ? 'landscape' : 'portrait',
                    unit: 'mm',
                    format: [currentPaperSize.width, currentPaperSize.height]
                });
                const imgData = canvas.toDataURL('image/png');
                pdf.addImage(imgData, 'PNG', 0, 0, currentPaperSize.width, currentPaperSize.height);
                pdf.save('photo-layout.pdf');
            };

            const downloadAsImage = async () => {
                const canvas = canvasRef.current;
                const format = exportFormat === 'png' ? 'image/png' : 'image/jpeg';
                const link = document.createElement('a');
                link.download = `photo-layout.${exportFormat}`;
                link.href = canvas.toDataURL(format);
                link.click();
            };

            const selectedPhotoData = photos.find(p => p.id === selectedPhoto);

            return (
                <div className="container">
                    <div className="header">
                        <h1>
                            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                                <circle cx="8.5" cy="8.5" r="1.5"></circle>
                                <polyline points="21 15 16 10 5 21"></polyline>
                            </svg>
                            Photo Layout Studio
                        </h1>
                        <p>Professional photo arrangement with fit/fill controls</p>
                    </div>
                    <div className="main-grid">
                        <div className="sidebar">
                            <div className="form-group">
                                <label>Upload Image</label>
                                <div className={`upload-area ${isDragOver ? 'drag-over' : ''}`} onClick={() => fileInputRef.current?.click()} onDrop={handleDrop} onDragOver={handleDragOver} onDragLeave={handleDragLeave}>
                                    <div className="upload-icon">
                                        <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{opacity: 0.6}}>
                                            <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path>
                                            <polyline points="13 2 13 9 20 9"></polyline>
                                        </svg>
                                    </div>
                                    <p><strong>Click to upload</strong> or drag and drop</p>
                                    <p style={{fontSize: '0.85rem', marginTop: '0.5rem', opacity: 0.7}}>PNG, JPG, JPEG</p>
                                </div>
                                <input ref={fileInputRef} type="file" accept="image/*" onChange={handleFileChange} />
                            </div>
                            {Object.keys(images).length > 0 && (
                                <div className="form-group">
                                    <label>Library ({Object.keys(images).length})</label>
                                    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: '0.5rem', marginTop: '0.5rem' }}>
                                        {Object.values(images).map(img => (
                                            <div key={img.id} onClick={() => setCurrentImageId(img.id)} style={{ position: 'relative', cursor: 'pointer', border: currentImageId === img.id ? '2px solid var(--primary)' : '1px solid var(--border)', borderRadius: '4px', overflow: 'hidden', aspectRatio: '1', transition: 'all 0.2s' }}>
                                                <img src={img.data} alt={img.name} style={{ width: '100%', height: '100%', objectFit: 'cover' }} />
                                                {currentImageId === img.id && ( <div style={{ position: 'absolute', top: '4px', right: '4px', background: 'var(--primary)', color: 'black', borderRadius: '50%', width: '18px', height: '18px', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '10px', fontWeight: 'bold' }}>✓</div> )}
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}
                            <div className="settings-grid">
                                <div className="form-group">
                                    <label>Photo Size</label>
                                    <select value={photoSize} onChange={(e) => setPhotoSize(e.target.value)}>
                                        {Object.entries(PHOTO_SIZES).map(([key, value]) => ( <option key={key} value={key}>{value.label}</option> ))}
                                    </select>
                                </div>
                                <div className="form-group">
                                    <label>Paper Size</label>
                                    <select value={paperSize} onChange={(e) => setPaperSize(e.target.value)}>
                                        {Object.entries(PAPER_SIZES).map(([key, value]) => ( <option key={key} value={key}>{value.label}</option> ))}
                                    </select>
                                </div>
                            </div>
                            {photoSize === 'custom' && (
                                <div className="settings-grid" style={{marginTop: '1rem'}}>
                                    <div className="form-group"><label>Width (mm)</label><input type="number" value={customWidth} onChange={(e) => setCustomWidth(Number(e.target.value))} min="10" max="300" /></div>
                                    <div className="form-group"><label>Height (mm)</label><input type="number" value={customHeight} onChange={(e) => setCustomHeight(Number(e.target.value))} min="10" max="300" /></div>
                                </div>
                            )}

                            {(selectedPhoto !== null || selectedPhotos.length > 0) && selectedPhotoData && (
                                <div className="form-group">
                                    <label>Image Display Mode {selectedPhotos.length > 0 && `(${selectedPhotos.length} photos)`}</label>
                                    <div className="fit-fill-options">
                                        <button 
                                            onClick={() => setFitMode('fit')}
                                            className="fit-fill-btn"
                                            style={{
                                                border: selectedPhotoData.fitMode === 'fit' ? '2px solid var(--primary)' : '1px solid var(--border)',
                                                background: selectedPhotoData.fitMode === 'fit' ? 'var(--primary)' : 'black',
                                                color: selectedPhotoData.fitMode === 'fit' ? 'black' : 'var(--text)'
                                            }}
                                        >
                                            Fit
                                        </button>
                                        <button 
                                            onClick={() => setFitMode('fill')}
                                            className="fit-fill-btn"
                                            style={{
                                                border: selectedPhotoData.fitMode === 'fill' ? '2px solid var(--primary)' : '1px solid var(--border)',
                                                background: selectedPhotoData.fitMode === 'fill' ? 'var(--primary)' : 'black',
                                                color: selectedPhotoData.fitMode === 'fill' ? 'black' : 'var(--text)'
                                            }}
                                        >
                                            Fill
                                        </button>
                                        <button 
                                            onClick={() => setFitMode('stretch')}
                                            className="fit-fill-btn"
                                            style={{
                                                border: selectedPhotoData.fitMode === 'stretch' ? '2px solid var(--primary)' : '1px solid var(--border)',
                                                background: selectedPhotoData.fitMode === 'stretch' ? 'var(--primary)' : 'black',
                                                color: selectedPhotoData.fitMode === 'stretch' ? 'black' : 'var(--text)'
                                            }}
                                        >
                                            Stretch
                                        </button>
                                    </div>
                                    <p style={{fontSize: '0.8rem', color: 'var(--text-muted)', marginTop: '0.5rem', lineHeight: '1.4'}}>
                                        {selectedPhotoData.fitMode === 'fit' && '✓ Entire image visible, may have bars'}
                                        {selectedPhotoData.fitMode === 'fill' && '✓ Fills frame, may crop edges'}
                                        {selectedPhotoData.fitMode === 'stretch' && '✓ Distorts to fit exactly'}
                                    </p>
                                    {selectedPhotoData.fitMode !== 'stretch' && selectedPhotos.length === 0 && (
                                        <p style={{fontSize: '0.8rem', color: '#4a9eff', marginTop: '0.5rem', lineHeight: '1.4'}}>
                                            💡 Hold Ctrl/Cmd + drag to pan image
                                        </p>
                                    )}
                                </div>
                            )}

                            <div className="form-group">
                                <label>Border Options</label>
                                <div className="checkbox-group"><input type="checkbox" id="showBorder" checked={showBorder} onChange={(e) => setShowBorder(e.target.checked)} /><label htmlFor="showBorder">Show Border</label></div>
                                {showBorder && (
                                    <div className="settings-grid" style={{marginTop: '1rem'}}>
                                        <div><label style={{fontSize: '0.85rem', marginBottom: '0.25rem'}}>Width (px)</label><input type="number" value={borderWidth} onChange={(e) => setBorderWidth(Number(e.target.value))} min="1" max="20" /></div>
                                        <div><label style={{fontSize: '0.85rem', marginBottom: '0.25rem'}}>Color</label><input type="color" value={borderColor} onChange={(e) => setBorderColor(e.target.value)} style={{width: '100%', height: '42px'}} /></div>
                                    </div>
                                )}
                            </div>
                            <div className="btn-group"><button className="btn btn-primary" onClick={addPhoto} disabled={!currentImageId} style={{flex: 1}}><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>Add Photo</button></div>
                            <div className="info-card">
                                <h4><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{verticalAlign: 'middle', marginRight: '0.25rem'}}><circle cx="12" cy="12" r="1"></circle><circle cx="12" cy="5" r="1"></circle><circle cx="12" cy="19" r="1"></circle></svg>Quick Actions</h4>
                                <div style={{display: 'flex', flexDirection: 'column', gap: '0.5rem', marginTop: '0.5rem'}}>
                                    <button className="btn btn-secondary" onClick={duplicateSelectedPhoto} disabled={selectedPhoto === null && selectedPhotos.length === 0} style={{width: '100%', fontSize: '0.9rem', padding: '0.6rem'}}><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>Duplicate</button>
                                    <div style={{display: 'flex', gap: '0.5rem'}}>
                                        <button className="btn btn-secondary" onClick={rotateLeft} disabled={selectedPhoto === null && selectedPhotos.length === 0} style={{flex: 1, fontSize: '0.9rem', padding: '0.6rem'}}><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M2.5 2v6h6M2.66 15.57a10 10 0 1 0 .57-8.38"></path></svg></button>
                                        <button className="btn btn-secondary" onClick={rotateRight} disabled={selectedPhoto === null && selectedPhotos.length === 0} style={{flex: 1, fontSize: '0.9rem', padding: '0.6rem'}}><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38"></path></svg></button>
                                    </div>
                                    <button className="btn btn-secondary" onClick={deleteSelectedPhoto} disabled={selectedPhoto === null && selectedPhotos.length === 0} style={{width: '100%', fontSize: '0.9rem', padding: '0.6rem', background: '#dc3545'}}><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>Delete</button>
                                    <button className="btn btn-secondary" onClick={clearAll} disabled={photos.length === 0} style={{width: '100%', fontSize: '0.9rem', padding: '0.6rem'}}><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon></svg>Clear All</button>
                                </div>
                            </div>
                            <div className="info-card" style={{borderColor: '#4a9eff'}}>
                                <h4>💡 Group Selection</h4>
                                <p style={{fontSize: '0.85rem', lineHeight: '1.5'}}>
                                    • Hold Shift + Click to select multiple<br/>
                                    • Ctrl+A to select all<br/>
                                    • Copy, move, rotate groups together
                                </p>
                            </div>
                            <div className="info-card" style={{borderColor: '#28a745'}}>
                                <h4>Canvas Info</h4>
                                <p>
                                    Photos on canvas: {photos.length}<br/>
                                    {selectedPhotos.length > 0 && `Selected: ${selectedPhotos.length} photos`}
                                    {selectedPhoto && selectedPhotos.length === 0 && 'Selected: 1 photo'}
                                </p>
                            </div>
                            <div className="form-group"><label>Export Format</label>
                                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '0.5rem' }}>
                                    <button onClick={() => setExportFormat('png')} style={{ padding: '0.7rem', border: exportFormat === 'png' ? '2px solid var(--primary)' : '1px solid var(--border)', borderRadius: '6px', background: exportFormat === 'png' ? 'var(--primary)' : 'black', color: exportFormat === 'png' ? 'black' : 'var(--text)', cursor: 'pointer', fontFamily: 'Outfit, sans-serif', fontWeight: exportFormat === 'png' ? '500' : '400', transition: 'all 0.2s', fontSize: '0.9rem' }}>PNG</button>
                                    <button onClick={() => setExportFormat('jpg')} style={{ padding: '0.7rem', border: exportFormat === 'jpg' ? '2px solid var(--primary)' : '1px solid var(--border)', borderRadius: '6px', background: exportFormat === 'jpg' ? 'var(--primary)' : 'black', color: exportFormat === 'jpg' ? 'black' : 'var(--text)', cursor: 'pointer', fontFamily: 'Outfit, sans-serif', fontWeight: exportFormat === 'jpg' ? '500' : '400', transition: 'all 0.2s', fontSize: '0.9rem' }}>JPG</button>
                                </div>
                            </div>
                            <div className="btn-group">
                                <button className="btn btn-primary" onClick={downloadAsPDF} disabled={photos.length === 0}><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>PDF</button>
                                <button className="btn btn-secondary" onClick={downloadAsImage} disabled={photos.length === 0}><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>{exportFormat.toUpperCase()}</button>
                            </div>
                        </div>
                        <div className="panel">
                            <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '1.5rem', paddingBottom: '0.75rem', borderBottom: '1px solid var(--border)'}}>
                                <h2 style={{margin: 0, border: 'none', padding: 0}}>Workspace</h2>
                                <div style={{display: 'flex', gap: '0.5rem', alignItems: 'center'}}>
                                    <button onClick={zoomOut} className="btn btn-secondary" style={{padding: '0.5rem 0.75rem', fontSize: '0.9rem'}} title="Zoom Out">
                                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                                            <circle cx="11" cy="11" r="8"></circle>
                                            <line x1="8" y1="11" x2="14" y2="11"></line>
                                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                                        </svg>
                                    </button>
                                    <span style={{fontSize: '0.85rem', minWidth: '50px', textAlign: 'center', color: 'var(--text-muted)'}}>{Math.round(zoom * 100)}%</span>
                                    <button onClick={zoomIn} className="btn btn-secondary" style={{padding: '0.5rem 0.75rem', fontSize: '0.9rem'}} title="Zoom In">
                                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                                            <circle cx="11" cy="11" r="8"></circle>
                                            <line x1="11" y1="8" x2="11" y2="14"></line>
                                            <line x1="8" y1="11" x2="14" y2="11"></line>
                                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                                        </svg>
                                    </button>
                                    <button onClick={resetZoom} className="btn btn-secondary" style={{padding: '0.5rem 0.75rem', fontSize: '0.85rem'}} title="Reset Zoom">
                                        100%
                                    </button>
                                </div>
                            </div>
                            <div className="preview-container">
                                <div className="canvas-wrapper">
                                    <canvas ref={canvasRef} className="paper-canvas interactive-canvas" style={{ maxWidth: '90%', maxHeight: 'calc(100vh - 300px)', width: 'auto', height: 'auto', border: '1px solid #ddd', cursor: dragging ? 'grabbing' : resizing ? 'nwse-resize' : panningImage ? 'move' : 'default', transform: `scale(${zoom})`, transformOrigin: 'center', transition: 'transform 0.2s ease' }} onMouseDown={handleMouseDown} onMouseMove={handleMouseMove} onMouseUp={handleMouseUp} onMouseLeave={handleMouseUp} />
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }
        ReactDOM.render(<PhotoLayoutApp />, document.getElementById('root'));
    </script>
</body>
</html>
